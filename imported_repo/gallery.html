<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KKEOPI | Gallery</title>
  <link rel="stylesheet" href="gallery.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="background"></div>

  <svg class="wave" viewBox="0 0 350 1000" preserveAspectRatio="none">
    <path
      fill="#BB8C64"
      fill-opacity=".35"
      d="M155 0
      C320 120 120 250 220 380
      C330 500 100 640 220 760
      C340 900 130 980 220 1000
      L350 1000
      L350 0Z" />
  </svg>

  <div class="container">
    <button onclick="window.location.href='KKEOPI.html'"> go back</button>
    
    <h1>Our Gallery</h1>
    <p class="subtitle">Freshly brewed drinks and pastries made with love.</p>

    <h2>Coffee</h2>
    <div class="gallery">
      <div class="card">
        <img src="https://frostingandfettuccine.com/wp-content/uploads/2022/12/Caramel-Iced-Coffee-6.jpg" alt="Caramel Iced Coffee">
        <h3>Caramel Iced Coffee</h3>
      </div>
      <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgDnHT6LTEKCmI2pJrgsleej0fQvez_DnVTEUowStRhdZLYjmKKCLsdJ8&s=10" alt="Iced Americano">

      </div>

        <img src="https://i.pinimg.com/736x/ca/73/28/ca732820d569e6c2a5d3f7ee340ab848.jpg" alt="Hazelnut Latte">
        <h3>Hazelnut Latte</h3>
      </div>
    </div>

    <h2>Non-Coffee</h2>
    <div class="gallery">
      <div class="card">
        <img src="https://cdn.shopify.com/s/files/1/0560/1699/4381/files/unnamed-1_1024x1024_a794ea7e-13eb-4360-9b3b-96cd7c8c3113.webp?v=1782242740" alt="Matcha Latte">
        <h3>Matcha Latte</h3>
      </div>
    </div>

    <h2>Pastries</h2>
    <div class="gallery">
      <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKMz-f2x5GurMjajeinpx_NyIyvMez1qdCqsYrmLvC6w&s=10" alt="Croissant">
        <h3>Croissant</h3>
      </div>
      <div class="card">
        <img src="https://sallysbakingaddiction.com/wp-content/uploads/2013/09/homemade-apple-turnovers-2-600x600.jpg" alt="Apple Turnover">
        <h3>Apple Turnover</h3>
      </div>
      <div class="card">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvZPswDaZ4iDScuGRPiBA67Mq2Rt1rqOHG2jlZywwPcQ&s=10" alt="Chocolate Pastry">
